# Render Blueprint: one free web service built from the Dockerfile.
# The three secrets are typed into Render's dashboard when the Blueprint is created; they are never in this repo.
services:
  - type: web
    name: canapply
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /ping
    envVars:
      - key: DATABASE_URL          # the hosted Postgres connection string (Neon, direct connection)
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_CHAT_ID         # Telegram chat id allowed to use /label and /stats
        sync: false
