[project]
name = "canapply"
version = "0.1.0"
description = "Eligibility-aware job matching: can I actually get this job?"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "selectolax>=0.3.21",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pypdf>=5.0",
  "numpy>=2.0",
  "fastembed>=0.9.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E701", "E702", "E731", "B905", "B007"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canapply"]
